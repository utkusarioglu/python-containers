name: build-and-push-single

on:
  workflow_call:
    inputs: 
      image_tag:
        description: Tag of the final docker image
        type: string
        required: true
      base_tag:
        description: Ubuntu base image tag
        type: string
        required: true
      container_name:
        type: string
        required: true
      image_tag:
        type: string
        required: true
      dockerfile_path:
        type: string
        required: true
      build_args:
        type: string
        required: true
      devcontainer_enabled:
        type: bool
        required: true
      devcontainer_subfolder:
        type: string
        required: true
      devcontainer_run_cmd_path:
        type: string
        required: true
      dockerhub_repo_description_update:
        type: bool
        required: true
      dockerhub_repo_short_description:
        type: string
        required: true
      dockerhub_repo_readme_file_path:
        type: string
        required: true
    secrets:
      dockerhub_username: 
        required: true
      dockerhub_token: 
        required: true 


jobs:
  build-and-push-single:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Build and push ${{ steps.variables.outputs.image_ref }}
        uses: utkusarioglu/devcontainer-build-action@main
        with:
          docker_context: src
          dockerhub_username: ${{ secrets.dockerhub_username }}
          dockerhub_token: ${{ secrets.dockerhub_token }}
          # image_name: ${{ matrix.images.container_name }}
          image_name: ${{ inputs.container_name }}
          # image_tag: ${{ matrix.images.image_tag }}
          image_tag: ${{ inputs.image_tag }}
          # dockerfile_path: ${{ matrix.images.dockerfile }}
          dockerfile_path: ${{ inputs.dockerfile_path }}

          # build_args: |
          #   BASE_TAG=${{ matrix.images.base_tag }}
          #   BASE_IMAGE=${{ matrix.images.base_image }}
          #   ENVIRONMENT_NAME=${{ matrix.images.environment_name }}
          #   PYTHON_VERSION=${{ matrix.images.python_version }}
          #   APT_PACKAGES=${{ matrix.images.apt_packages }}
          #   APT_PACKAGES_SILENT=${{ matrix.images.apt_packages_silent }}
          build_args: ${{ inputs.build_args }}

          # devcontainer_enabled: "false"
          devcontainer_enabled: ${{ inputs.devcontainer_enabled }}

          # devcontainer_subfolder: src/${{ matrix.images.devcontainer_subfolder }}
          devcontainer_subfolder: ${{ inputs.devcontainer_subfolder }}
          # devcontainer_run_cmd_path: /home/dev/scripts/bootstrap/python/check-devcontainer.sh
          devcontainer_run_cmd_path: ${{ inputs.devcontainer_run_cmd_path }}

          # dockerhub_repo_description_update: false
          dockerhub_repo_description_update: ${{ inputs.dockerhub_repo_description_update }}

          # dockerhub_repo_short_description: ${{ matrix.images.dockerhub_short_description }}
          dockerhub_repo_short_description: ${{ inputs.dockerhub_short_description }}
          # dockerhub_repo_readme_file_path: ${{ matrix.images.dockerhub_readme_path }}
          dockerhub_repo_readme_file_path: ${{ inputs.dockerhub_readme_path }}
