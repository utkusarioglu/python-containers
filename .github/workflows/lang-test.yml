name: LangTest

on:
  workflow_dispatch:

jobs:
  lang-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: docker://utkusarioglu/conda-music-devcontainer:3.13-ubuntu-test-36
        with: 
          args: -c "\
            echo $LANG \
            && micromamba activate music \
            && echo $LANG"
